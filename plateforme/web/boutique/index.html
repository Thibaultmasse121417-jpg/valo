<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La boutique</title>
  <meta name="description" content="Toutes les pièces de la boutique : vêtements, accessoires, nouveautés et promotions.">
  <meta name="theme-color" content="#f8f4ee">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23171412'/%3E%3C/svg%3E">
  <script type="module" src="../src/catalogue.js"></script>
</head>
<body data-page="catalogue">
  <div data-haut></div>
  <main id="contenu">
    <header class="cat-tete wrap">
      <nav class="fil" aria-label="Fil d’Ariane"><a href="/">Accueil</a><span aria-hidden="true">/</span><span data-fil></span></nav>
      <h1 data-cat-titre>Toute la boutique</h1>
      <p class="cat-tete__sous" data-cat-sous hidden></p>
      <figure class="cat-visuel" data-cat-visuel hidden></figure>
    </header>
    <div class="filtres">
      <div class="wrap filtres__in">
        <div class="chips" role="group" aria-label="Rayons" data-chips></div>
        <div class="selects">
          <label class="case case--filtre"><input type="checkbox" data-dispo><span>Disponibles</span></label>
          <label class="select"><span class="sr">Taille</span><select data-taille aria-label="Taille"></select></label>
          <label class="select"><span class="sr">Trier</span><select data-tri aria-label="Trier">
            <option value="nouveautes">Nouveautés</option>
            <option value="populaires">Meilleures ventes</option>
            <option value="prix-asc">Prix croissant</option>
            <option value="prix-desc">Prix décroissant</option>
          </select></label>
        </div>
      </div>
    </div>
    <div class="wrap">
      <p class="cat-compte"><span data-cat-compte aria-live="polite"></span><button class="lien-petit" type="button" data-reinit hidden>Effacer les filtres</button></p>
      <ul class="grille" data-grid role="list"></ul>
      <div class="vide" data-grille-vide hidden>
        <h2 data-vide-titre>Rien pour le moment</h2>
        <p data-vide-texte></p>
        <button class="btn btn--ligne" type="button" data-reinit>Voir toute la boutique</button>
      </div>
    </div>
    <div class="section section--fin"></div>
  </main>
  <div data-bas></div>
</body>
</html>
