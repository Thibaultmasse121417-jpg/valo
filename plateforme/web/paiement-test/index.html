<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Paiement (test)</title>
  <script type="module" src="../src/pages.js"></script>
</head>
<body class="page" data-page="paiement">
  <header class="pg-top"><a class="pg-logo" href="/" data-logo></a></header>
  <main class="pg-main">
    <p class="pg-alerte">Paiement simulé : aucune carte n’est demandée ni débitée. Quand la boutique active le paiement en ligne, cette étape est remplacée par la page de paiement Stripe.</p>
    <p class="pg-kicker">Dernière étape</p>
    <h1 data-titre>Commande</h1>
    <ul class="pg-lignes" data-lignes role="list"></ul>
    <dl class="pg-totaux" data-totaux></dl>
    <p class="pg-actions">
      <button class="pg-btn" type="button" data-payer>Simuler le paiement</button>
      <button class="pg-lnk" type="button" data-annuler>Annuler et revenir à la boutique</button>
    </p>
    <p class="pg-err" data-err aria-live="polite"></p>
  </main>
</body>
</html>
