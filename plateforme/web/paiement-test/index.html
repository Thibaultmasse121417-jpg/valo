<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Paiement (test)</title>
  <script type="module" src="../src/pages.js"></script>
</head>
<body class="page" data-page="paiement">
  <header class="pg-top"><a class="pg-logo" href="/" data-logo></a></header>
  <main class="pg-main">
    <p class="pg-alerte">Paiement de test : aucune carte n’est débitée. Sur une boutique en ligne, cette page est remplacée par le paiement sécurisé Stripe.</p>
    <p class="pg-kicker">Paiement</p>
    <h1 data-titre>Commande</h1>
    <ul class="pg-lignes" data-lignes role="list"></ul>
    <dl class="pg-totaux" data-totaux></dl>
    <div class="pg-carte" aria-hidden="true"><span>4242 4242 4242 4242</span><span>12 / 34 · 123</span></div>
    <p class="pg-actions">
      <button class="pg-btn" type="button" data-payer>Payer</button>
      <button class="pg-lnk" type="button" data-annuler>Annuler et revenir à la boutique</button>
    </p>
    <p class="pg-err" data-err aria-live="polite"></p>
  </main>
</body>
</html>
